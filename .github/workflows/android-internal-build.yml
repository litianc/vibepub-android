name: Android Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: android-release-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read published Android releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -s 'add' > "$RUNNER_TEMP/android-releases.json"

      - name: Validate Android release version
        run: |
          node scripts/manage-android-version.mjs check
          node scripts/manage-android-version.mjs check-releases "$RUNNER_TEMP/android-releases.json"

      - name: Read Android release identity
        id: app_version
        run: node scripts/manage-android-version.mjs github-output "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify official release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          EXPECTED_TAG: v${{ steps.app_version.outputs.version_name }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match Android version $EXPECTED_TAG" >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          present=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then
              present=$((present + 1))
            fi
          done

          if [[ "$present" -ne 4 ]]; then
            echo "Stable Android signing requires all four Android signing secrets." >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/android-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/vibepub.keystore"
          {
            echo "VIBEPUB_RELEASE_STORE_FILE=$RUNNER_TEMP/android-signing/vibepub.keystore"
            echo "VIBEPUB_RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "VIBEPUB_RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "VIBEPUB_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> android/gradle.properties
          echo "Configured stable Android signing for internal APKs."

      - name: Run automated tests
        env:
          ORG_GRADLE_PROJECT_VIBEPUB_GIT_COMMIT: ${{ github.sha }}
        run: gradle -p android :app:testDebugUnitTest

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_VIBEPUB_GIT_COMMIT: ${{ github.sha }}
        run: gradle -p android :app:assembleRelease

      - name: Prepare versioned release APK
        env:
          ARTIFACT_NAME: ${{ steps.app_version.outputs.artifact_name }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$ARTIFACT_NAME"

      - name: Verify final release APK identity
        env:
          ARTIFACT_NAME: ${{ steps.app_version.outputs.artifact_name }}
        run: |
          VIBEPUB_AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt" \
          VIBEPUB_APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            node scripts/manage-android-version.mjs verify-apk "dist/$ARTIFACT_NAME" "$GITHUB_SHA"

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibepub-release-apk
          path: dist/${{ steps.app_version.outputs.artifact_name }}
          if-no-files-found: error

      - name: Generate Tag Name (For Internal Builds)
        if: github.event_name == 'workflow_dispatch'
        id: internal_tag
        run: echo "tag_name=build-$(date +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Recheck published Android releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -s 'add' > "$RUNNER_TEMP/android-releases.json"
          node scripts/manage-android-version.mjs check-releases "$RUNNER_TEMP/android-releases.json"

      - name: Create Internal Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.internal_tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "VibePub ${{ steps.app_version.outputs.version_name }} (${{ steps.app_version.outputs.version_code }}) - ${{ steps.app_version.outputs.git_commit }}"
          generate_release_notes: true
          files: dist/${{ steps.app_version.outputs.artifact_name }}

      - name: Create Official Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "VibePub v${{ steps.app_version.outputs.version_name }} (${{ steps.app_version.outputs.version_code }}) - ${{ steps.app_version.outputs.git_commit }}"
          generate_release_notes: true
          files: dist/${{ steps.app_version.outputs.artifact_name }}
