name: Android Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "scripts/manage-android-version.mjs"
      - "scripts/manage-android-version.test.mjs"
      - "scripts/android-version-workflows.test.mjs"
      - "scripts/verify-android-environment-apks.sh"
      - ".github/workflows/android-tests.yml"
  pull_request:
    paths:
      - "android/**"
      - "scripts/manage-android-version.mjs"
      - "scripts/manage-android-version.test.mjs"
      - "scripts/android-version-workflows.test.mjs"
      - "scripts/verify-android-environment-apks.sh"
      - ".github/workflows/android-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Android version metadata
        run: node scripts/manage-android-version.mjs check

      - name: Require an Android version bump
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/manage-android-version.mjs check-git-ref "$BASE_REF"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Run Production unit tests
        run: gradle -p android :app:testDebugUnitTest -PVIBEPUB_ENVIRONMENT=production

      - name: Run Staging unit tests
        run: gradle -p android :app:testDebugUnitTest -PVIBEPUB_ENVIRONMENT=staging -PVIBEPUB_STAGING_API_BASE_URL=https://staging.vibepub.invalid -PVIBEPUB_ALLOW_TEST_INVALID_STAGING_API=true

      - name: Reject unsafe Staging API origins
        run: |
          for api_base_url in \
            https://vibepub.litianc.cn. \
            https://vibepub.litianc.cn.:443 \
            https://VIBEPUB.LITIANC.CN./ \
            https://staging.vibepub.invalid; do
            if gradle -p android help \
              -PVIBEPUB_ENVIRONMENT=staging \
              -PVIBEPUB_STAGING_API_BASE_URL="$api_base_url"; then
              echo "Accepted unsafe Staging API origin" >&2
              exit 1
            fi
          done

          for api_base_url in https://invalid https://invalid.; do
            if gradle -p android help \
              -PVIBEPUB_ENVIRONMENT=staging \
              -PVIBEPUB_STAGING_API_BASE_URL="$api_base_url" \
              -PVIBEPUB_ALLOW_TEST_INVALID_STAGING_API=true; then
              echo "Accepted reserved exact invalid hostname" >&2
              exit 1
            fi
          done

      - name: Verify Production and Staging APK identities
        run: |
          gradle -p android :app:assembleDebug -PVIBEPUB_ENVIRONMENT=production
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/vibepub-production.apk
          gradle -p android :app:assembleDebug -PVIBEPUB_ENVIRONMENT=staging -PVIBEPUB_STAGING_API_BASE_URL=https://staging.vibepub.invalid -PVIBEPUB_ALLOW_TEST_INVALID_STAGING_API=true
          ALLOW_SYNTHETIC_STAGING_API_URL=true scripts/verify-android-environment-apks.sh \
            /tmp/vibepub-production.apk \
            android/app/build/outputs/apk/debug/app-debug.apk \
            https://staging.vibepub.invalid \
            --skip-release-certificate

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
