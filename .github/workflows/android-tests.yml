name: Android Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "scripts/manage-android-version.mjs"
      - "scripts/manage-android-version.test.mjs"
      - "scripts/android-version-workflows.test.mjs"
      - ".github/workflows/android-tests.yml"
  pull_request:
    paths:
      - "android/**"
      - "scripts/manage-android-version.mjs"
      - "scripts/manage-android-version.test.mjs"
      - "scripts/android-version-workflows.test.mjs"
      - ".github/workflows/android-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Android version metadata
        run: node scripts/manage-android-version.mjs check

      - name: Require an Android version bump
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/manage-android-version.mjs check-git-ref "$BASE_REF"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Run automated tests
        run: gradle -p android :app:testDebugUnitTest

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
