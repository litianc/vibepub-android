name: Test Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".codex/skills/**"
      - ".gitignore"
      - "AGENTS.md"
      - "CONTEXT.md"
      - "android/release-certificate.sha256"
      - "docs/agents/**"
      - "docs/release-batch-extraction.md"
      - "scripts/**"
      - "skills-lock.json"
      - "docs/android-*.md"
      - ".github/workflows/android-internal-build.yml"
      - ".github/workflows/test-infrastructure.yml"
  pull_request:
    paths:
      - ".codex/skills/**"
      - ".gitignore"
      - "AGENTS.md"
      - "CONTEXT.md"
      - "android/release-certificate.sha256"
      - "docs/agents/**"
      - "docs/release-batch-extraction.md"
      - "scripts/**"
      - "skills-lock.json"
      - "docs/android-*.md"
      - ".github/workflows/android-internal-build.yml"
      - ".github/workflows/test-infrastructure.yml"

jobs:
  shell:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check shell script syntax
        run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Check Android environment safety behavior
        run: |
          scripts/test-android-package-data-digest.sh
          scripts/test-android-package-login-state.sh
          scripts/test-android-package-session-me.sh
          scripts/test-android-environment-isolation-safety.sh
          scripts/test-android-environment-isolation-success.sh

      - name: Check repository hygiene
        run: scripts/check-repository-hygiene.sh

      - name: Check help commands
        run: |
          scripts/android-device-visual-test.sh --help >/dev/null
          scripts/check-android-device-ready.sh --help >/dev/null
          scripts/download-latest-android-apk.sh --help >/dev/null
          scripts/install-latest-android-apk.sh --help >/dev/null
          scripts/run-android-device-smoke.sh --help >/dev/null
          node scripts/manage-android-version.mjs --help >/dev/null
          scripts/android-package-data-digest.sh --help >/dev/null
          scripts/android-package-login-state.sh --help >/dev/null
          scripts/android-package-session-me.sh --help >/dev/null
          scripts/verify-android-environment-isolation.sh --help >/dev/null

      - name: Test Android version management
        run: node --test scripts/manage-android-version.test.mjs scripts/android-version-workflows.test.mjs
