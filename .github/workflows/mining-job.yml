name: VibePub Mining Job

on:
  schedule:
    # Low-frequency fallback; uploads actively dispatch this workflow.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      target_filename:
        description: "Optional exact recording filename to process from R2 inbox"
        required: false
        type: string
      target_key:
        description: "Optional exact R2 key to process"
        required: false
        type: string
      user_id:
        description: "Optional VibePub user id that owns the target input"
        required: false
        type: string
      revision_request_key:
        description: "Optional R2 JSON key for a voice-driven article revision request"
        required: false
        type: string

concurrency:
  group: vibepub-mining
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'infra/mining/package-lock.json'

      - name: Install dependencies
        working-directory: infra/mining
        run: npm ci || npm install

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Run Mining Job
        working-directory: infra/mining
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VOLC_ASR_APPID: ${{ secrets.VOLC_ASR_APPID }}
          VOLC_ASR_ACCESS_TOKEN: ${{ secrets.VOLC_ASR_ACCESS_TOKEN }}
          VOLC_ASR_RESOURCE_ID: ${{ secrets.VOLC_ASR_RESOURCE_ID }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_MODEL: ${{ secrets.GLM_MODEL }}
          GPT_IMAGE_API_KEY: ${{ secrets.GPT_IMAGE_API_KEY }}
          GPT_IMAGE_BASE_URL: ${{ vars.GPT_IMAGE_BASE_URL }}
          GPT_IMAGE_MODEL: ${{ vars.GPT_IMAGE_MODEL }}
          GPT_IMAGE_SIZE: ${{ vars.GPT_IMAGE_SIZE }}
          GPT_IMAGE_TIMEOUT_MS: ${{ vars.GPT_IMAGE_TIMEOUT_MS }}
          WRITING_AGENT_BASE_URL: ${{ vars.WRITING_AGENT_BASE_URL }}
          WRITING_AGENT_TOKEN: ${{ secrets.WRITING_AGENT_TOKEN }}
          WRITING_AGENT_STYLE_PROFILE_ID: ${{ vars.WRITING_AGENT_STYLE_PROFILE_ID }}
          WRITING_AGENT_STYLE_PROFILE_VERSION: ${{ vars.WRITING_AGENT_STYLE_PROFILE_VERSION }}
          WRITING_AGENT_LAYOUT_PROFILE_ID: ${{ vars.WRITING_AGENT_LAYOUT_PROFILE_ID }}
          WRITING_AGENT_LAYOUT_PROFILE_VERSION: ${{ vars.WRITING_AGENT_LAYOUT_PROFILE_VERSION }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_PROXY: ${{ secrets.WECHAT_PROXY }}
          FILES_TOKEN: ${{ secrets.FILES_TOKEN }}
          MINING_SERVICE_TOKEN: ${{ secrets.MINING_SERVICE_TOKEN }}
          MINING_V3_HANDOFF_TOKEN: ${{ secrets.MINING_V3_HANDOFF_TOKEN }}
          MINING_V3_HANDOFF_ENABLED: "true"
          PUBLIC_BASE_URL: "https://vibepub.litianc.cn"
          CLEANUP_PERMANENT_AUDIO_FAILURES: "true"
          TARGET_FILENAME: ${{ inputs.target_filename }}
          TARGET_KEY: ${{ inputs.target_key }}
          WRITING_AGENT_USER_ID: ${{ inputs.user_id }}
          REVISION_REQUEST_KEY: ${{ inputs.revision_request_key }}
        run: npm start
