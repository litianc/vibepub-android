name: Validate / Deploy Worker

on:
  pull_request:
    paths:
      - "infra/worker/**"
      - ".github/workflows/deploy-worker.yml"
  push:
    branches:
      - main
    paths:
      - "infra/worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Set true to deploy the Worker after validation; push and PR runs validate only
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  validate:
    name: Validate Worker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/worker

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Deploy dry run
        run: |
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx wrangler deploy --dry-run \
            --var "DEPLOY_COMMIT:${GITHUB_SHA}" \
            --var "DEPLOY_REF:${GITHUB_REF_NAME}" \
            --var "DEPLOYED_AT:${DEPLOYED_AT}"

  deploy:
    name: Deploy Worker (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == 'true'
    needs: validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/worker

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Set Workflow Dispatch Secret
        if: env.WORKFLOW_DISPATCH_PAT != ''
        run: printf '%s' "$WORKFLOW_DISPATCH_PAT" | npx wrangler secret put GITHUB_PAT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKFLOW_DISPATCH_PAT: ${{ secrets.WORKFLOW_DISPATCH_PAT }}

      - name: Set WritingAgent Secret
        if: env.WRITING_AGENT_TOKEN != ''
        run: printf '%s' "$WRITING_AGENT_TOKEN" | npx wrangler secret put WRITING_AGENT_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRITING_AGENT_TOKEN: ${{ secrets.WRITING_AGENT_TOKEN }}

      - name: Deploy
        run: |
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx wrangler deploy \
            --message "GitHub Actions ${GITHUB_SHA} (${GITHUB_REF_NAME})" \
            --var "DEPLOY_COMMIT:${GITHUB_SHA}" \
            --var "DEPLOY_REF:${GITHUB_REF_NAME}" \
            --var "DEPLOYED_AT:${DEPLOYED_AT}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
